auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /logstore
  storage:
    filesystem:
      chunks_directory: /logstore/chunks
      rules_directory: /logstore/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# By default, Logstore will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Acme Labs. These statistics are sent to https://stats.acme.org/
#
# Statistics help us better understand how Logstore is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://example.com/acme/logstore/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
