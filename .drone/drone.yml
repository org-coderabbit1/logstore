---
kind: pipeline
name: logstore-build-image
steps:
- image: plugins/docker
  name: test-image
  settings:
    context: logstore-build-image
    dockerfile: logstore-build-image/Dockerfile
    dry_run: true
    repo: acme/logstore-build-image
    tags:
    - 0.24.2
  when:
    event:
    - pull_request
    paths:
    - logstore-build-image/**
- image: plugins/docker
  name: push-image
  settings:
    context: logstore-build-image
    dockerfile: logstore-build-image/Dockerfile
    dry_run: false
    password:
      from_secret: docker_password
    repo: acme/logstore-build-image
    tags:
    - 0.24.2
    username:
      from_secret: docker_username
  when:
    event:
    - push
    - tag
    paths:
    - logstore-build-image/**
trigger:
  ref:
  - refs/heads/main
  - refs/heads/k???
  - refs/tags/v*
  - refs/pull/*/head
workspace:
  base: /src
  path: logstore
---
kind: pipeline
name: helm-test-image
steps:
- image: plugins/docker
  name: test-image
  settings:
    dockerfile: production/helm/logstore/src/helm-test/Dockerfile
    dry_run: true
    repo: acme/logstore-helm-test
  when:
    event:
    - pull_request
    paths:
    - production/helm/logstore/src/helm-test/**
- image: plugins/docker
  name: push-image
  settings:
    dockerfile: production/helm/logstore/src/helm-test/Dockerfile
    dry_run: false
    password:
      from_secret: docker_password
    repo: acme/logstore-helm-test
    username:
      from_secret: docker_username
  when:
    event:
    - push
    - tag
    paths:
    - production/helm/logstore/src/helm-test/**
trigger:
  ref:
  - refs/heads/main
  - refs/heads/k???
  - refs/tags/v*
  - refs/pull/*/head
workspace:
  base: /src
  path: logstore
---
kind: pipeline
name: check
steps:
- commands:
  - make BUILD_IN_CONTAINER=false check-drone-drift
  depends_on:
  - clone
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: check-drone-drift
- commands:
  - make BUILD_IN_CONTAINER=false check-generated-files
  depends_on:
  - clone
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: check-generated-files
- commands:
  - cd ..
  - 'echo "cloning "$DRONE_TARGET_BRANCH '
  - git clone -b $DRONE_TARGET_BRANCH $CI_REPO_REMOTE logstore-target-branch
  - cd -
  depends_on:
  - clone
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: clone-target-branch
  when:
    event:
    - pull_request
- commands:
  - make BUILD_IN_CONTAINER=false test
  depends_on:
  - clone-target-branch
  - check-generated-files
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: test
- commands:
  - cd ../logstore-target-branch
  - BUILD_IN_CONTAINER=false make test
  depends_on:
  - clone-target-branch
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: test-target-branch
  when:
    event:
    - pull_request
- commands:
  - make BUILD_IN_CONTAINER=false compare-coverage old=../logstore-target-branch/test_results.txt
    new=test_results.txt packages=ingester,distributor,querier,querier/queryrange,iter,storage,chunkenc,logql,logstore
    > diff.txt
  depends_on:
  - test
  - test-target-branch
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: compare-coverage
  when:
    event:
    - pull_request
- commands:
  - pull=$(echo $CI_COMMIT_REF | awk -F '/' '{print $3}')
  - 'body=$(jq -Rs ''{body: . }'' diff.txt)'
  - 'curl -X POST -u $USER:$TOKEN -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/acme/logstore/issues/$pull/comments
    -d "$body" > /dev/null'
  depends_on:
  - compare-coverage
  environment:
    TOKEN:
      from_secret: github_token
    USER: acmebot
  image: acme/logstore-build-image:0.24.2
  name: report-coverage
  when:
    event:
    - pull_request
- commands:
  - make BUILD_IN_CONTAINER=false lint
  depends_on:
  - check-generated-files
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: lint
- commands:
  - make BUILD_IN_CONTAINER=false check-mod
  depends_on:
  - test
  - lint
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: check-mod
- commands:
  - apk add make bash && make lint-scripts
  image: koalaman/shellcheck-alpine:stable
  name: shellcheck
- commands:
  - make BUILD_IN_CONTAINER=false logstore
  depends_on:
  - check-generated-files
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: logstore
- commands:
  - make BUILD_IN_CONTAINER=false validate-example-configs
  depends_on:
  - logstore
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: validate-example-configs
- commands:
  - make BUILD_IN_CONTAINER=false check-example-config-doc
  depends_on:
  - clone
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: check-example-config-doc
trigger:
  ref:
  - refs/heads/main
  - refs/heads/k???
  - refs/tags/v*
  - refs/pull/*/head
workspace:
  base: /src
  path: logstore
---
kind: pipeline
name: mixins
steps:
- commands:
  - make BUILD_IN_CONTAINER=false lint-jsonnet
  depends_on:
  - clone
  environment: {}
  image: acme/jsonnet-build:c8b75df
  name: lint-jsonnet
- commands:
  - make BUILD_IN_CONTAINER=false logstore-mixin-check
  depends_on:
  - clone
  environment: {}
  image: acme/logstore-build-image:0.24.2
  name: logstore-mixin-check
  when:
    event:
    - pull_request
    paths:
    - production/logstore-mixin/**
trigger:
  ref:
  - refs/heads/main
  - refs/heads/k???
  - refs/tags/v*
  - refs/pull/*/head
workspace:
  base: /src
  path: logstore
---
