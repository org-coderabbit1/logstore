---
gateway:
  ingress:
    enabled: true
    annotations: {}
    hosts:
      - host: gateway.logstore.example.com
        paths:
          - path: /
            pathType: Prefix
logstore:
  commonConfig:
    replication_factor: 1
  useTestSchema: true
  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
read:
  replicas: 1
write:
  replicas: 1
backend:
  replicas: 1
monitoring:
  logstoreCanary:
    enabled: false
test:
  enabled: false
