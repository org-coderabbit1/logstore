---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: acme
  namespace: default
spec:
  interval: 1m
  url: https://acme.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: log-generator
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: acme
        namespace: default
      interval: 1m
  values:
    controller:
      type: deployment
    alloy:
      configMap:
        content: |
          logging {
            level = "debug"
            write_to = [logstore.relabel.default.receiver]
          }

          logstore.relabel "default" {
            rule {
              target_label = "source"
              replacement = "log-generator"
            }
            forward_to = [logstore.write.default.receiver]
          }

          logstore.write "default" {
            endpoint {
              url = "http://logstore-gateway.logstore.svc/logstore/api/v1/push"
            }
          }
