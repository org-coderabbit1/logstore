---
apiVersion: helm-chart-toolbox.acme.com/v1
kind: TestPlan
name: distributed-advanced
subject:
  releaseName: logstore
  namespace: logstore
  path: ../../..
  valuesFile: non-default-values.yaml
  extraArgs:
    - --dependency-update
    - --set
    - "chunksCache.allocatedMemory=128"

cluster:
  type: kind

dependencies:
  - file: log-generator.yaml
  - preset: acme
    overrides:
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Logstore
              type: logstore
              url: http://logstore-gateway.logstore.svc/logstore/api/v1/query
              isDefault: true

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        # Individual microservices (distributed mode)
        - kind: StatefulSet
          name: logstore-ruler
          namespace: logstore
        - kind: StatefulSet
          name: logstore-ingester
          namespace: logstore
        - kind: Deployment
          name: logstore-distributor
          namespace: logstore
        - kind: StatefulSet
          name: logstore-compactor
          namespace: logstore
        - kind: StatefulSet
          name: logstore-index-gateway
          namespace: logstore
        - kind: Deployment
          name: logstore-querier
          namespace: logstore
        - kind: Deployment
          name: logstore-query-frontend
          namespace: logstore
        - kind: Deployment
          name: logstore-query-scheduler
          namespace: logstore
        - kind: Deployment
          name: logstore-gateway
          namespace: logstore

        # Caching components
        - kind: StatefulSet
          name: logstore-chunks-cache-l1
          namespace: logstore
        - kind: StatefulSet
          name: logstore-chunks-cache-l2
          namespace: logstore
        - kind: StatefulSet
          name: logstore-results-cache
          namespace: logstore

        # MinIO for storage
        - kind: StatefulSet
          name: logstore-minio
          namespace: logstore

        # Services for all components
        - kind: Service
          name: logstore-ruler
          namespace: logstore
        - kind: Service
          name: logstore-ingester
          namespace: logstore
        - kind: Service
          name: logstore-distributor
          namespace: logstore
        - kind: Service
          name: logstore-compactor
          namespace: logstore
        - kind: Service
          name: logstore-index-gateway
          namespace: logstore
        - kind: Service
          name: logstore-querier
          namespace: logstore
        - kind: Service
          name: logstore-query-frontend
          namespace: logstore
        - kind: Service
          name: logstore-query-scheduler
          namespace: logstore
        - kind: Service
          name: logstore-gateway
          namespace: logstore
        - kind: Service
          name: logstore-chunks-cache-l1
          namespace: logstore
        - kind: Service
          name: logstore-chunks-cache-l2
          namespace: logstore
        - kind: Service
          name: logstore-results-cache
          namespace: logstore
        - kind: Service
          name: logstore-minio
          namespace: logstore
        - kind: Service
          name: logstore-memberlist
          namespace: logstore

  - type: query-test
    values:
      tests:
        - env:
            LOGSTORE_URL: http://logstore-gateway.logstore.svc/logstore/api/v1/query
          queries:
            - query: count_over_time({source="log-generator"}[1h])
              type: logql
