---
apiVersion: helm-chart-toolbox.acme.com/v1
kind: TestPlan
name: single-binary
subject:
  releaseName: logstore
  namespace: logstore
  path: ../../..
  valuesFile: default-single-binary-values.yaml
  extraArgs:
    - --dependency-update
    - --set
    - "chunksCache.allocatedMemory=1024"

cluster:
  type: kind

dependencies:
  - file: log-generator.yaml
  - preset: acme
    overrides:
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Logstore
              type: logstore
              url: http://logstore.logstore.svc:3100/
              isDefault: true
              jsonData:
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                httpHeaderValue1: "1"

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - kind: StatefulSet
          name: logstore
          namespace: logstore
        - kind: StatefulSet
          name: logstore-chunks-cache
          namespace: logstore
        - kind: StatefulSet
          name: logstore-results-cache
          namespace: logstore

        # Logstore services
        - kind: Service
          name: logstore
          namespace: logstore
        - kind: Service
          name: logstore-canary
          namespace: logstore
        - kind: Service
          name: logstore-chunks-cache
          namespace: logstore
        - kind: Service
          name: logstore-gateway
          namespace: logstore
        - kind: Service
          name: logstore-headless
          namespace: logstore
        - kind: Service
          name: logstore-memberlist
          namespace: logstore
        - kind: Service
          name: logstore-results-cache
          namespace: logstore

  - type: query-test
    values:
      tests:
        - env:
            LOGSTORE_URL: http://logstore.logstore.svc:3100/logstore/api/v1/query
            LOGSTORE_TENANTID: 1
          queries:
            - query: count_over_time({source="log-generator"}[1h])
              type: logql
