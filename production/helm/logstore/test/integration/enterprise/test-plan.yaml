---
apiVersion: helm-chart-toolbox.acme.com/v1
kind: TestPlan
name: enterprise
subject:
  releaseName: logstore
  namespace: logstore
  path: ../../..
  valuesFile: enterprise.yaml
  extraArgs:
    - --dependency-update
    - --set
    - "chunksCache.allocatedMemory=1024"

cluster:
  type: kind

dependencies:
  - file: monitoring-secret.yaml
  - file: log-generator.yaml
  - preset: acme
    overrides:
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Logstore
              type: logstore
              url: http://logstore.logstore.svc:3100/
              isDefault: true
              jsonData:
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                httpHeaderValue1: "1"

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - kind: StatefulSet
          name: enterprise-logs-backend
          namespace: logstore
        - kind: StatefulSet
          name: enterprise-logs-write
          namespace: logstore
        - kind: StatefulSet
          name: logstore-enterprise-logs-chunks-cache
          namespace: logstore
        - kind: StatefulSet
          name: logstore-enterprise-logs-results-cache
          namespace: logstore
        - kind: Deployment
          name: enterprise-logs-read
          namespace: logstore
        - kind: Deployment
          name: logstore-enterprise-logs-gateway
          namespace: logstore

        # Logstore services
        - kind: Service
          name: enterprise-logs-backend
          namespace: logstore
        - kind: Service
          name: enterprise-logs-read
          namespace: logstore
        - kind: Service
          name: enterprise-logs-write
          namespace: logstore
        - kind: Service
          name: enterprise-logs-canary
          namespace: logstore
        - kind: Service
          name: logstore-enterprise-logs-chunks-cache
          namespace: logstore
        - kind: Service
          name: logstore-enterprise-logs-gateway
          namespace: logstore
        - kind: Service
          name: enterprise-logs-memberlist
          namespace: logstore
        - kind: Service
          name: logstore-enterprise-logs-results-cache
          namespace: logstore

  - type: query-test
    values:
      tests:
        - env:
            LOGSTORE_URL: http://logstore-enterprise-logs-gateway.logstore.svc/logstore/api/v1/query
            LOGSTORE_TENANTID: 1
          queries:
            - query: count_over_time({source="log-generator"}[1h])
              type: logql
