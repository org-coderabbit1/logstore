{{- $isSingleBinary := eq (include "logstore.deployment.isSingleBinary" .) "true" -}}
{{- if $isSingleBinary }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstore.name" . }}-headless
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logstore.labels" . | nindent 4 }}
    {{- with .Values.logstore.serviceLabels }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.singleBinary.service.labels }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    variant: headless
    prometheus.io/service-monitor: "false"
  annotations:
    {{- with .Values.logstore.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.singleBinary.service.annotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
spec:
  clusterIP: None
  ports:
    - name: http-metrics
      port: {{ .Values.logstore.server.http_listen_port }}
      targetPort: http-metrics
      protocol: TCP
  selector:
    {{- include "logstore.selectorLabels" . | nindent 4 }}
{{- end }}
