{{- $isSimpleScalable := eq (include "logstore.deployment.isScalable" .) "true" -}}
{{- if and $isSimpleScalable (gt (int .Values.write.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "logstore.writeFullname" . }}
  namespace: {{ include "logstore.namespace" . }}
  labels:
    {{- include "logstore.writeLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "logstore.writeSelectorLabels" . | nindent 6 }}
  maxUnavailable: 1
{{- end }}
