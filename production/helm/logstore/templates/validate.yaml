{{- if .Values.config }}
{{- fail "Top level 'config' is not allowed. Most common configuration sections are exposed under the `logstore` section. If you need to override the whole config, provide the configuration as a string that can contain template expressions under `logstore.config`. Alternatively, you can provide the configuration as an external secret." }}
{{- end }}

{{ with .Values.monitoring.selfMonitoring}}

{{- if and (not .enabled) .logstoreCanary.enabled }}
{{- fail "Logstore Canary requires self monitoring to also be enabled"}}
{{- end }}

{{- if and (not .enabled) $.Values.test.enabled }}
{{- fail "Helm test requires self monitoring to be enabled"}}
{{- end }}

{{- if and (not .logstoreCanary.enabled) $.Values.test.enabled }}
{{- fail "Helm test requires the Logstore Canary to be enabled"}}
{{- end }}

{{- end}}

{{- if and .Values.test.enabled (not .Values.test.prometheusAddress) }}
{{- fail "Helm test requires a prometheusAddress for an instance scraping the Logstore canary's metrics"}}
{{- end }}

