{{- with .Values.test }}
{{- if (and .enabled $.Values.logstoreCanary.enabled) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "logstore.name" $ }}-helm-test"
  namespace: {{ include "logstore.namespace" $ }}
  labels:
    {{- include "logstore.helmTestLabels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": test
spec:
  {{- if and (semverCompare ">=1.33-0" (include "logstore.kubeVersion" $)) (kindIs "bool" .hostUsers) }}
  hostUsers: {{ .hostUsers }}
  {{- end }}
  containers:
    - name: logstore-helm-test
      image: {{ include "logstore.helmTestImage" $ }}
      env:
        - name: CANARY_SERVICE_ADDRESS
          value: "{{ .canaryServiceAddress }}"
        - name: CANARY_PROMETHEUS_ADDRESS
          value: "{{ .prometheusAddress }}"
        {{- with .timeout }}
        - name: CANARY_TEST_TIMEOUT
          value: "{{ . }}"
        {{- end }}
      args:
        - -test.v
  restartPolicy: Never
{{- end }}
{{- end }}
