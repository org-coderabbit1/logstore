{{- $isDistributed := eq (include "logstore.deployment.isDistributed" .) "true" -}}
{{- if $isDistributed -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstore.querierFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logstore.querierLabels" . | nindent 4 }}
    {{- with .Values.querier.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.logstore.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.querier.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
      {{- if .Values.querier.appProtocol.grpc }}
      appProtocol: {{ .Values.querier.appProtocol.grpc }}
      {{- end }}
  selector:
    {{- include "logstore.querierSelectorLabels" . | nindent 4 }}
{{- end -}}
