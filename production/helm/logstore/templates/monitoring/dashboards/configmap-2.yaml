{{- with .Values.monitoring.dashboards }}
{{- if .enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logstore.dashboardsName" $ }}-2
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "logstore.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  "logstore-reads-resources.json": |
    {{ $.Files.Get "src/dashboards/logstore-reads-resources.json" | fromJson | toJson }}
  "logstore-reads.json": |
    {{ $.Files.Get "src/dashboards/logstore-reads.json" | fromJson | toJson }}
  "logstore-retention.json": |
    {{ $.Files.Get "src/dashboards/logstore-retention.json" | fromJson | toJson }}
  "logstore-writes-resources.json": |
    {{ $.Files.Get "src/dashboards/logstore-writes-resources.json" | fromJson | toJson }}
  "logstore-writes.json": |
    {{ $.Files.Get "src/dashboards/logstore-writes.json" | fromJson | toJson }}
{{- end -}}
{{- end -}}
