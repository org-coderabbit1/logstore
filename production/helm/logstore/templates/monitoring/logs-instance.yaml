{{- if .Values.monitoring.selfMonitoring.enabled }}
{{- with .Values.monitoring.selfMonitoring.logsInstance }}
apiVersion: monitoring.acme.com/v1alpha1
kind: LogsInstance
metadata:
  name: {{ include "logstore.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "logstore.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  clients:
    {{- include "logstore.logsInstanceClient" $ | nindent 4}}
    {{- with .clients}}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  podLogsNamespaceSelector: {}

  podLogsSelector:
    matchLabels:
      {{- include "logstore.selectorLabels" $ | nindent 6 }}
{{- end -}}
{{- end -}}