{{- $isDistributed := eq (include "logstore.deployment.isDistributed" .) "true" -}}
{{- if $isDistributed }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstore.compactorFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logstore.labels" . | nindent 4 }}
    {{- with .Values.compactor.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: compactor
  annotations:
    {{- with .Values.logstore.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.compactor.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
      {{- if .Values.compactor.appProtocol.grpc }}
      appProtocol: {{ .Values.compactor.appProtocol.grpc }}
      {{- end }}
  selector:
    {{- include "logstore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: compactor
{{- end }}
