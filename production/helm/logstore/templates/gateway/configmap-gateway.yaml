{{- $isSimpleScalable := eq (include "logstore.deployment.isScalable" .) "true" -}}
{{- if and .Values.gateway.enabled $isSimpleScalable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logstore.gatewayFullname" . }}
  labels:
    {{- include "logstore.gatewayLabels" . | nindent 4 }}
data:
  nginx.conf: |
    {{- tpl (ternary .Values.enterprise.nginxConfig.file .Values.gateway.nginxConfig.file .Values.enterprise.enabled) . | nindent 4 }}
{{- end }}
