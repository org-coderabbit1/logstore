{{- if .Values.tableManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstore.fullname" . }}-table-manager
  labels:
    {{- include "logstore.labels" . | nindent 4 }}
    {{- with .Values.logstore.serviceLabels }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.tableManager.service.labels }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    app.kubernetes.io/component: table-manager
  annotations:
    {{- with .Values.logstore.serviceAnnotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
    {{- with .Values.tableManager.service.annotations }}
    {{- toYaml . | nindent 4}}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: {{ .Values.logstore.server.http_listen_port }}
      targetPort: http-metrics
      protocol: TCP
    - name: grpc
      port: {{ .Values.logstore.server.grpc_listen_port }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "logstore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: table-manager
{{- end }}
