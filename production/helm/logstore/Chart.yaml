apiVersion: v2
name: logstore
description: Helm chart for Acme Logstore and Acme Enterprise Logs supporting both simple, scalable and distributed modes.
type: application
appVersion: 3.2.0
version: 6.18.0
home: https://acme.github.io/helm-charts
sources:
  - https://example.com/acme/logstore
  - https://acme.com/oss/logstore/
  - https://acme.com/docs/logstore/latest/
icon: https://acme.com/docs/logstore/latest/logo_and_name.png
dependencies:
  - name: minio
    alias: minio
    version: 4.0.15
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: acme-agent-operator
    alias: acme-agent-operator
    version: 0.3.15
    repository: https://acme.github.io/helm-charts
    condition: monitoring.selfMonitoring.acmeAgent.installOperator
  - name: rollout-operator
    alias: rollout_operator
    repository: https://acme.github.io/helm-charts
    version: 0.13.0
    condition: rollout_operator.enabled
maintainers:
  - name: trevorwhitney
  - name: jeschkies
