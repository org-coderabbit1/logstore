version: "3.8"

networks:
  logstore:


volumes:
  prometheus:
  acme:
  alertmanager-data:


services:

  # Since the Logstore containers are running as user 10001 and the mounted data volume is owned by root,
  # Logstore would not have permissions to create the directories.
  # Therefore the init container changes permissions of the mounted directory.
  init:
    image: acme/logstore:2.8.2
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/logstore"
    volumes:
      - ./logstore:/logstore
    networks:
      - logstore

  acme:
    image: acme/acme:9.1.6
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./config/datasources.yaml:/etc/acme/provisioning/datasources/datasources.yml
      - acme:/var/lib/acme
    networks:
      - logstore

  prometheus:
    image: prom/prometheus:v2.27.0
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus
    command:
      [
        '--log.level=debug',
        '--config.file=/etc/prometheus/prometheus.yml',
        '--enable-feature=remote-write-receiver',
        '--query.lookback-delta=30s'
      ]
    networks:
      - logstore

  # for testing purposes only, disable in production
  log-generator:
    image: mingrammer/flog
    command:
      - --loop
      - --format=json
      - --number=10 # number of log lines to generate per second
      - --delay=100ms # delay between log lines
      - --output=/var/log/generated-logs.txt
      - --overwrite
      - --type=log
    volumes:
      - ./logstore/:/var/log/

  promtail:
    image: acme/promtail:2.8.2
    volumes:
      - ./logstore/:/var/log/
      - ./config:/etc/promtail/
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - logstore

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/logstore-data && \
        mkdir -p /data/logstore-ruler &&
        minio server /data
    environment:
      - MINIO_ROOT_USER=logstore
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000:9000"
    volumes:
      - ./.data/minio:/data
    networks:
      - logstore

  logstore-gateway:
    image: nginx:1.19
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
      - "3100"
    networks:
      - logstore

  logstore-read:
    image: acme/logstore:2.8.2
    volumes:
      - ./config:/etc/logstore/
      - ./rules:/logstore/rules:ro
    ports:
      - "3100"
      - "7946"
      # uncomment to use interactive debugging
      # - "40000-40002:40000" # # makes the replicas available on ports 40000, 40001, 40002
      #cap_add:
      #  - SYS_PTRACE
      #security_opt:
      #  - apparmor=unconfined
    command: "-config.file=/etc/logstore/logstore.yaml -target=read"
    networks:
      - logstore
    restart: always
    deploy:
      mode: replicated
      replicas: 3
    # only needed for interactive debugging with dlv

  logstore-write:
    image: acme/logstore:2.8.2
    volumes:
      - ./config:/etc/logstore/
    ports:
      - "3100"
      - "7946"
      # uncomment to use interactive debugging
      # - "50000-50002:40000" # makes the replicas available on ports 50000, 50001, 50002
      # cap_add:
      #   - SYS_PTRACE
      # security_opt:
      #   - apparmor=unconfined
    command: "-config.file=/etc/logstore/logstore.yaml -target=write"
    networks:
      - logstore
    restart: always
    deploy:
      mode: replicated
      replicas: 3

  # alertmanager to enable receiving alerts
  alertmanager:
    image: prom/alertmanager:v0.23.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - "./config:/config"
      - alertmanager-data:/data
    command: --config.file=/config/alertmanager.yml --log.level=debug
    networks:
      - logstore
