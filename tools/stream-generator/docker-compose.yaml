services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
    depends_on:
      - broker
    networks:
      - logstore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
      - 29092:29092
      - 29093:29093
      - 29094:29094
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,STREAMETAGEN:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092,STREAMETAGEN://broker:29094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092,STREAMETAGEN://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - logstore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  logstore:
    image: theperiklis/logstore:feat-usage-tracker-293aed8
    hostname: logstore
    container_name: logstore
    user: root
    ports:
      - 3100:3100
      - 9096:9096
      - 7946:7946
    volumes:
      - ./logstore-local-config.debug.yaml:/etc/logstore/local-config.yaml
      - ./entrypoint.sh:/entrypoint.sh
      - logstore-data:/tmp/logstore
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - broker
    networks:
      - logstore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  generator:
    image: theperiklis/stream-generator:latest
    hostname: generator
    container_name: generator
    build:
      context: ../..
      dockerfile: tools/stream-generator/Dockerfile
    ports:
      - 3101:3100
      - 7947:7947
    command:
      - --log.level=debug
      - --tenants.total=2
      - --tenants.streams.total=500
      - --tenants.qps=50
      - --memberlist.bind-port=7947
      - --memberlist.advertise-port=7947
      - --memberlist.join=logstore:7946
      - --kafka.address=broker:29094
      - --kafka.topic=logstore
      - --kafka.auto-create-topic-default-partitions=1000
      - --stream-generator.store=memberlist
      - --stream-generator.push-target=metadata-topic-only
    depends_on:
      - broker
      - logstore
    networks:
      - logstore
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  logstore:
    driver: bridge

volumes:
  logstore-data:
