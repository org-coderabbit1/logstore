apiVersion: 1
datasources:
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686 
  - name: Logstore
    type: logstore
    access: proxy
    url: http://query-frontend:8007
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: '1'
  - name: Logstore-Limited
    type: logstore
    access: proxy
    url: http://query-frontend:8007
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
      httpHeaderName2: 'X-Logstore-Query-Limits'
    secureJsonData:
      httpHeaderValue1: '1'
      httpHeaderValue2: '{"maxQueryLength":"30m"}'
