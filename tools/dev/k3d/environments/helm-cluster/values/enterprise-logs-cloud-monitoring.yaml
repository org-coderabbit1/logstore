---
logstore:
  querier:
    multi_tenant_queries_enabled: true
enterprise:
  enabled: true
  adminToken:
    secret: "gel-admin-token"
  useExternalLicense: true
  externalLicenseName: gel-license
  provisioner:
    provisionedSecretPrefix: "provisioned-secret"
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  selfMonitoring:
    tenant:
      name: logstore
    logsInstance:
      clients:
        - url: https://logs-prod-us-central1.acme.net/logstore/api/v1/push
          basicAuth:
            username:
              name: acme-cloud-logs-credentials
              key: username
            password:
              name: acme-cloud-logs-credentials
              key: password
  serviceMonitor:
    metricsInstance:
      remoteWrite:
        - url: https://prometheus-blocks-prod-us-central1.acme.net/api/prom/push
          basicAuth:
            username:
              name: acme-cloud-metrics-credentials
              key: username
            password:
              name: acme-cloud-metrics-credentials
              key: password
minio:
  enabled: true
