# permissions for end users to edit logstorestacks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logstorestack-editor-role
rules:
- apiGroups:
  - logstore.acme.com
  resources:
  - logstorestacks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - logstore.acme.com
  resources:
  - logstorestacks/status
  verbs:
  - get
