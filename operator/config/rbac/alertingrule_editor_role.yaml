# permissions for end users to edit alertingrules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alertingrule-editor-role
rules:
- apiGroups:
  - logstore.acme.com
  resources:
  - alertingrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - logstore.acme.com
  resources:
  - alertingrules/status
  verbs:
  - get
