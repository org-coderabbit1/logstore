# permissions for end users to view alertingrules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alertingrule-viewer-role
rules:
- apiGroups:
  - logstore.acme.com
  resources:
  - alertingrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - logstore.acme.com
  resources:
  - alertingrules/status
  verbs:
  - get
