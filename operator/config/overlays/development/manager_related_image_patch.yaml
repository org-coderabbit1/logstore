apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
          - name: RELATED_IMAGE_LOGSTORE
            value: docker.io/acme/logstore:3.2.1
          - name: RELATED_IMAGE_GATEWAY
            value: quay.io/observatorium/api:latest
