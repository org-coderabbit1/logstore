apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    name: logstore-operator
  name: metrics-monitor
spec:
  endpoints:
    - path: /metrics
      targetPort: 8443
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: bearer
        credentials:
          key: token
          name: logstore-operator-controller-manager-metrics-token
      tlsConfig:
        ca:
          secret:
            key: service-ca.crt
            name: logstore-operator-controller-manager-metrics-token
        serverName: logstore-operator-controller-manager-metrics-service.openshift-operators-redhat.svc
